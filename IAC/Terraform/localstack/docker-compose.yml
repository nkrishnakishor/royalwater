version: "3.8"

services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
      - "8081:8081"        # EKS Traefik ingress / load balancer
    environment:
      - SERVICES=ec2,eks,ecr,iam,sts,s3,codebuild,codepipeline
      - DEBUG=0
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=us-east-1
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}
      - LOCALSTACK_ACKNOWLEDGE_ACCOUNT_REQUIREMENT=1
      - EKS_START_K3D_LB_INGRESS=1   # enable Traefik ingress + LB on port 8081
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "localstack-data:/var/lib/localstack"
    networks:
      - localstack-net

volumes:
  localstack-data:

networks:
  localstack-net:
    driver: bridge
